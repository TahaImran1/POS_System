<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      
      .node-root { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; rx: 8; }
      .node-inter { fill: #172554; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .node-edge { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 8; }
      
      .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #f8fafc; text-anchor: middle; }
      .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      
      .sync-line { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 4 4; }
      .layer-tag { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; fill: #f59e0b; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Title -->
  <text x="30" y="40" class="title">Dynamic N-Tier Database Topology</text>
  <text x="30" y="60" class="subtitle">Scalable Tree Hierarchy: Root (Postgres) ➔ Intermediate Servers ➔ Edge Devices (SQLite)</text>

  <!-- Level 0: Root -->
  <text x="30" y="110" class="layer-tag">LEVEL 0: GLOBAL ROOT</text>
  <g transform="translate(370, 100)">
    <rect width="220" height="70" class="node-root"/>
    <text x="110" y="32" class="node-title">🗄️ Master HQ DB</text>
    <text x="110" y="52" class="node-sub">PostgreSQL Central Server</text>
  </g>

  <!-- Level 1: Regional -->
  <text x="30" y="240" class="layer-tag">LEVEL 1: PROVINCE / REGION</text>
  <g transform="translate(200, 230)">
    <rect width="200" height="65" class="node-inter"/>
    <text x="100" y="30" class="node-title">🏢 Provincial DB 1</text>
    <text x="100" y="48" class="node-sub">PostgreSQL Server</text>
  </g>
  <g transform="translate(560, 230)">
    <rect width="200" height="65" class="node-inter"/>
    <text x="100" y="30" class="node-title">🏢 Provincial DB 2</text>
    <text x="100" y="48" class="node-sub">PostgreSQL Server</text>
  </g>

  <!-- Level 2: City / Branch -->
  <text x="30" y="370" class="layer-tag">LEVEL 2: CITY / BRANCH</text>
  <g transform="translate(100, 360)">
    <rect width="180" height="60" class="node-inter"/>
    <text x="90" y="28" class="node-title">🏙️ City DB A</text>
    <text x="90" y="45" class="node-sub">PostgreSQL Server</text>
  </g>
  <g transform="translate(390, 360)">
    <rect width="180" height="60" class="node-inter"/>
    <text x="90" y="28" class="node-title">🏙️ City DB B</text>
    <text x="90" y="45" class="node-sub">PostgreSQL Server</text>
  </g>
  <g transform="translate(680, 360)">
    <rect width="180" height="60" class="node-inter"/>
    <text x="90" y="28" class="node-title">🏬 Branch Server C</text>
    <text x="90" y="45" class="node-sub">PostgreSQL Server</text>
  </g>

  <!-- Level 3: Edge Devices -->
  <text x="30" y="480" class="layer-tag">LEVEL 3: EDGE TERMINALS</text>
  <g transform="translate(50, 470)">
    <rect width="140" height="55" class="node-edge"/>
    <text x="70" y="25" class="node-title">📱 Tablet POS 1</text>
    <text x="70" y="42" class="node-sub">SQLite Local</text>
  </g>
  <g transform="translate(210, 470)">
    <rect width="140" height="55" class="node-edge"/>
    <text x="70" y="25" class="node-title">💻 Desktop POS 2</text>
    <text x="70" y="42" class="node-sub">SQLite Local</text>
  </g>
  <g transform="translate(410, 470)">
    <rect width="140" height="55" class="node-edge"/>
    <text x="70" y="25" class="node-title">📱 Mobile POS 3</text>
    <text x="70" y="42" class="node-sub">SQLite Local</text>
  </g>
  <g transform="translate(700, 470)">
    <rect width="140" height="55" class="node-edge"/>
    <text x="70" y="25" class="node-title">💻 Dedicated POS 4</text>
    <text x="70" y="42" class="node-sub">SQLite Local</text>
  </g>

  <!-- Connections -->
  <line x1="480" y1="170" x2="300" y2="230" class="sync-line"/>
  <line x1="480" y1="170" x2="660" y2="230" class="sync-line"/>

  <line x1="300" y1="295" x2="190" y2="360" class="sync-line"/>
  <line x1="300" y1="295" x2="480" y2="360" class="sync-line"/>
  <line x1="660" y1="295" x2="770" y2="360" class="sync-line"/>

  <line x1="190" y1="420" x2="120" y2="470" class="sync-line"/>
  <line x1="190" y1="420" x2="280" y2="470" class="sync-line"/>
  <line x1="480" y1="420" x2="480" y2="470" class="sync-line"/>
  <line x1="770" y1="420" x2="770" y2="470" class="sync-line"/>
</svg>
